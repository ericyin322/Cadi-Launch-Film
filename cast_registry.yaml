    frames: 362
    cast: [heroine]
    prompt: "segments/SEG-02/seg02-a-minimax-h3-prompt-v03.txt"
    beat: "門外飛紙、衝出關門、背靠門嘆氣撥髮、手錶震動；低鼓漸強。"
  - id: "seg02-b"
    scene: 2
    seed: 7201
    frames: 362
    cast: [heroine, teams_ui]
