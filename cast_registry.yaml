project:
  title: "Cadi Launch Film"
  aspect_ratio: "16:9"
  frames_per_segment: 362
  label_style: "paired"
  section_style: "detailed"
  # 成片畫風唯一來源：detailed_description 開頭逐字複製這句，不從參考圖推斷。
  # 畫風只用正向描述；不得出現 2D／animation／cel／drawing／illustration／design sheet 等字眼（check_prompt.py 會擋）。
  visual_style: >-
    Photorealistic live-action cinema footage shot on a digital cinema camera with prime lenses: natural skin texture with visible pores, real fabric weave, physically accurate reflections, shallow depth of field and subtle film grain.

assets:
  heroine:
    priority: 10
    file: "assets/characters/heroine-photo-reference-v01.png"
    role: "identity"
    binding: "Her face, hair, and clothing follow"
    canonical: >-
      the female protagonist, a 20-something East Asian female mechanical R&D engineer.
      She has long, straight, center-parted black hair and wears a tailored taupe-gray
      blazer, an ivory crew-neck top, and loose light-colored trousers. She is
      professional, composed, and places a high value on immaculate grooming.
    retention: >-
      fully preserved: her facial features, long straight center-parted black hair,
      tailored taupe-gray blazer, ivory crew-neck top, loose light-colored trousers,
      body proportions, professional composure, and immaculate grooming must remain
      consistent. She is a real person with real skin, real fabric and real lighting inside
      the scene described by the timeline.

  cadi:
    summon_tokens: ["cadi", "mascot", "plasma", "flame head", "robot", "chest core"]
    priority: 20
    file: "assets/characters/cadi Design Sheet.jpg"
    role: "identity"
    binding: "Its design, proportions, and colors follow"
    canonical: >-
      Cadi, a small flying robot mascot. Its head is composed of actively burning,
      ethereal cyan-blue plasma fire that continuously flickers, dances, and undulates
      with rising wisps and subtle luminous embers (an energetic plasma flame, completely
      non-solid, with zero gelatinous or jelly-like surface tension). Within the dynamic
      flame sit two oversized oval cyan eyes and a tiny mouth, atop a dark navy segmented
      robot body and a glowing circular cyan chest core. Its height is approximately half
      of the female protagonist's upper body.
    retention: >-
      fully preserved: its actively burning cyan-blue plasma fire head, continuous
      flickering combustion, soft rising flame tongues, subtle luminous embers, wind-drag
      during movement, upward licking and dissipation while hovering, oversized oval cyan
      eyes, tiny mouth, dark navy segmented robot body, body proportions, and glowing
      circular cyan chest core must remain consistent. It is lit by the same real lighting as the scene
      described by the timeline.
    extra_negatives:
      - "rubbery, gelatinous, solid jelly texture"
      - "solid glass surface"

  teams_ui:
    summon_tokens: ["teams", "group-chat interface", "message bubble"]
    priority: 30
    file: "assets/software/teams-ui-reference-v01.png"
    role: "interface"
    binding: "Its layout, colors, icons and bubble styling follow"
    canonical: >-
      the group-chat interface reference: a team-chat screen with a dark violet-navy
      header bar carrying the chat title and call icons, a white message area, round
      colleague avatars down screen-left, and light incoming bubbles beside them.
    retention: >-
      fully preserved: header bar, title placement, call icons, avatar column, bubble
      shape, corner radius, spacing and type scale. Do not copy the reference's own
      sample messages, sender names, timestamps, unread badges, photo avatars or side
      panels; all visible text comes from the segment's specified lines.


  phone_home:
    priority: 40
    file: "assets/software/phone-home-reference-v01.png"
    role: "interface"
    binding: "Its wallpaper and Teams app icon placement follow"
    canonical: >-
      the unlocked phone home screen, with the wallpaper and the Teams app icon
      in the positions shown by the supplied home-screen reference.
    retention: >-
      Preserve the wallpaper, icon appearance, icon size and icon position within
      the phone display. The email notification is layered above this home screen.

# 不出場的資產不得列入 cast：不上傳參考圖、不編索引、提示詞一個字都不提。
# H3 沒有否定運算子，「排除宣告」與「保留槽」只會把物件召喚進畫面。
# summon_tokens 供 check_prompt.py 反向比對：資產不在 cast 時，這些字眼出現即 FAIL。

segments:
  - id: "S03a"
    scene: 3
    seed: 7301
    cast: [heroine, cadi]
    beat: "女主抵達工作位並接上工作站；呼叫 Cadi，Cadi 從介面彈出並表示已掌握狀況。"
  - id: "S03b"
    scene: 3
    seed: 7301
    cast: [heroine, cadi]
    continues_from: "S03a"
    beat: "女主揉眼、放手重新聚焦並接受協作；Cadi 胸口光源擴張，青藍光掃鏡形成轉場。"
  - id: "seg01-a"
    scene: 1
    seed: 7101
    frames: 362
    cast: [heroine]
    prompt: "segments/SEG-01/seg01-a-minimax-h3-prompt-v07.txt"
    beat: "吵雜會議；女主角整理落紙、合上筆電並起身。"
  - id: "seg01-b"
    scene: 1
    seed: 7101
    frames: 362
    cast: [heroine]
    continues_from: "seg01-a"
    prompt: "segments/SEG-01/seg01-b-minimax-h3-prompt-v07.txt"
    beat: "女主角悄悄離開會議室，輕輕關門、背靠門嘆氣撥髮。"

  - id: "seg02-a"
    scene: 2
    seed: 7201
    frames: 362
    cast: [heroine]
    prompt: "segments/SEG-02/seg02-a-minimax-h3-prompt-v06.txt"
    beat: "背靠門、手錶亮起震動、皺眉看錶、掏出手機亮屏；低鼓隨震動進入並漸強。"
  - id: "seg02-b"
    scene: 2
    seed: 7201
    frames: 362
    cast: [teams_ui, phone_home]
    continues_from: "seg02-a"
    prompt: "segments/SEG-02/seg02-b-minimax-h3-prompt-v08.txt"
    beat: "手機 RF 郵件通知停留、點開 Teams、滿版群組三則抱怨；腳步聲引出 SEG-03。女主角只露手與袖口，不掛她的圖。"



