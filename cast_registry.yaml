    priority: 25
    summon_tokens:
    - drop
    file: assets/characters/agent3-drop.png
    role: identity
    binding: Its appearance, proportions, and colors follow
    canonical: drop, a compact white humanoid service robot with a smooth solid white teardrop-shaped head
      tapering to one rounded peak, two large blue eyes, a small expressive mouth, white armored body panels,
      black articulated joints, circular blue-lit side modules, and a glowing blue water-drop emblem centered
      on its chest.
    retention: 'fully preserved: its solid teardrop head silhouette, blue eyes, small mouth, white armor,
      black articulated joints, blue-lit side modules, water-drop chest emblem and body proportions. Its
      white shell reflects the physical district lighting.'

  ray:
    priority: 90
    file: assets/characters/agent5-ray.png
    role: identity
    binding: Its appearance, proportions, and colors follow
    summon_tokens:
    - ray
    canonical: Ray, a compact white humanoid service robot with a rounded rectangular
      head, a glossy black face display, two luminous yellow oval eyes, a small yellow
      expressive mouth, twin gold lightning-bolt antennae, dark circular side modules
      with gold rims, black articulated joints, a gold lightning-bolt chest emblem,
      and a rectangular transport backpack bearing a gold lightning symbol.
    retention: 'fully preserved: its white shell, black face display, yellow eyes and
      mouth, twin lightning antennae, gold accents, chest emblem, dark articulated limbs,
      transport backpack and compact body proportions. Its shell and joints reflect
      the physical lighting of the scene.'

  fan_placement:
    priority: 95
    file: assets/placement/Screenshot 2026-09-22 165319.png
    role: exact_fan_shape_scale_and_local_placement
    binding: Its exact shape, relative scale, top profile, edge thickness, position and spacing follow
    summon_tokens:
    - cooling-fan housing
    - placement geometry
    - placement assembly
    canonical: the larger upper-right cooling-fan housing and its immediately adjacent placement geometry. It is a broad low-profile gray housing with a rounded outer corner, a straight inner edge, a large concentric circular top structure, a raised central circular cap, and a thin layered sidewall, resting within the green placement base.
    retention: Preserve the larger upper-right fan housing's exact rounded rectangular silhouette, concentric circular top structure, raised central cap, layered sidewall, relative size, placement position, adjacent spacing and human-to-fan scale; render it as solid full-scale engineering hardware with physically accurate gray metal and polymer surfaces, direct floor support, contact shadows and dock-light reflections.

  placement_angle:
    priority: 96
    file: assets/placement/bottom view 3_1.png
    role: exact_camera_angle_and_composition
    binding: Its camera azimuth, downward tilt, framing, perspective and component overlap follow
    summon_tokens:
    - placement-creo viewing angle
    canonical: the low oblique three-quarter placement-creo viewing angle. The larger fan dominates the right foreground, the smaller fan is cropped at lower left, the long pale module crosses the upper frame, the cyan module enters at upper right, and the green placement base remains visible between them.
    retention: Preserve the low oblique three-quarter camera azimuth, downward tilt, perspective, crop and component overlap.

  finn:
    priority: 100
    file: assets/characters/agent4-finn.png
    role: identity
    binding: Its appearance, proportions, and colors follow
    summon_tokens:
    - finn
    canonical: Finn, a compact tracked research robot with a rounded rectangular white
