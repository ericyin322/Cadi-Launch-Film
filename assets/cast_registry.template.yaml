# cast_registry.yaml —— 整個專案的單一事實來源
#
# 每一段的 <Subject N>/<Picture N>/ref_image_{N-1} 綁定都從這裡機械推導。
# canonical 欄位的英文描述會被「逐字」複製進每一段 prompt 的 subject_definitions，
# 所以這裡改一個字，全案 26 段都要重跑。定案後就不要動。

project:
  title: ""
  aspect_ratio: "16:9"          # Ref2VA 只支援 16:9 / 9:16
  frames_per_segment: 362       # 15.083s，見 references/h3-constraints.md
  label_style: "paired"         # Subject/Picture 配對（node pack 契約），已定案
  section_style: "detailed"     # Ref2VA 六區段，已定案

# ---------------------------------------------------------------------------
# 資產。priority 決定區域索引的指派順序，數字小的先拿到 <Picture 1>。
# 同一場景內出場的資產按 priority 升冪排列，依序編號 1, 2, 3...
# ---------------------------------------------------------------------------
assets:

  heroine:
    priority: 10
    file: "refs/heroine.png"
    role: "identity"
    binding: "Her face, hair, and clothing follow"
    canonical: >-
      the female protagonist, a 20-something East Asian female mechanical R&D engineer.
      She has long, straight, center-parted black hair and wears a tailored taupe-gray
      blazer, an ivory crew-neck top, and loose light-colored trousers. She is
      professional, composed, and places a high value on immaculate grooming.
    retention: >-
      fully preserved: her facial features, hair, clothing, and composed demeanor must
      remain consistent.

  cadi:
    priority: 20
    file: "refs/cadi.png"
    role: "identity"
    binding: "Its design, proportions, and colors follow"
    canonical: >-
      Cadi, a small flying robot mascot. Its head is composed of actively burning,
      ethereal cyan-blue plasma fire that continuously flickers, dances, and undulates
      with rising wisps and subtle luminous embers (an energetic plasma flame, completely
      non-solid, with zero gelatinous or jelly-like surface tension). Within the dynamic
      flame sit two oversized oval cyan eyes and a tiny mouth, atop a dark navy segmented
      robot body and a glowing circular cyan chest core. Its height is approximately half
      of the female protagonist's upper body.
    retention: >-
      fully preserved: its active cyan plasma burning flame head (maintaining continuous
      flickering combustion dynamics, soft flame tip dissipation, and floating embers
      without solid jelly gloss), cyan eyes, navy body, and glowing chest core must remain
      consistent.
    # 這個角色特有的負面詞，出場時自動追加到該段的 negative 表列
    extra_negatives:
      - "jelly or gelatinous head texture"
      - "solid glass surface"

  # 其他角色 —— priority 30 起，依劇本首次出場順序遞增
  # senior_engineer:
  #   priority: 30
  #   file: "refs/senior_engineer.png"
  #   role: "identity"
  #   canonical: >-
  #     ...
  #   retention: >-
  #     ...

  # 場景／環境 —— priority 60 起
  virtual_factory:
    priority: 60
    file: "refs/virtual_factory.png"
    role: "environment"
    binding: "Its architecture, lighting, and layout follow"
    canonical: >-
      the virtual factory, a near-future engineering city inspired by the street
      aesthetics of Taiwan and Hong Kong. It features a southern entrance observation
      deck, a central north-south floating transit lane, engineering service buildings
      lining both sides, warm vertical neon shapes, and cyan data light rails.
    retention: >-
      fully preserved: the architectural style, neon lighting, and cyan data rails must
      construct the background environment consistently.

  # 道具／風格 —— priority 80 起

# ---------------------------------------------------------------------------
# 分段表。每個場景 30 秒 = 兩段（a / b）。
# cast 只列這一段真正出場的資產 key，順序無所謂 —— 編號由 priority 決定。
# 同場景的兩段共用同一個 seed，讓 B 段的接續有機會對齊 A 段。
# ---------------------------------------------------------------------------
segments:

  - id: "S01a"
    scene: 1
    seed: 7101
    cast: [heroine]
    beat: "（這一段發生什麼，中文寫給人看的，不會進 prompt）"

  - id: "S01b"
    scene: 1
    seed: 7101
    cast: [heroine]
    continues_from: "S01a"
    beat: ""

  - id: "S02a"
    scene: 2
    seed: 7201
    cast: [cadi]
    beat: ""

  - id: "S03a"
    scene: 3
    seed: 7301
    cast: [heroine, cadi]
    beat: ""

  - id: "S04a"
    scene: 4
    seed: 7401
    cast: [heroine, cadi, virtual_factory]
    beat: ""

  # ... 補到 S13b，共 26 段
