    canonical: the exact SEG-12 A ending frame, seen from a fixed eye-level camera inside the Creo dock. A photorealistic East Asian woman with long, straight, center-parted black hair, a taupe-gray blazer, an ivory top and light trousers crouches at center-left behind the two cooling fans, both hands resting on the larger fan's top plate. Cadi, a small robot with an actively burning red plasma-fire head, oversized warm-white eyes with dark red rims, a dark charcoal-gray body with red joint accents and a glowing warm-white chest core, stands on the rear-left of that top plate holding a small glowing cyan orb. The large gray fan with its recessed concentric ring fills the right foreground, the smaller fan fills the lower left, and both sit on a flat green placement platform resting level on the polished gray dock floor. Behind them the dock aisle recedes to the center background under a yellow overhead crane, white-gray walls and warm ceiling lamps.
