    environment_description: A bright futuristic engineering district beneath a blue sky with white clouds. A glowing
      cyan transport avenue leads toward a monumental tower surrounded by enormous horizontal rings. Multilevel
      automated workshops line both sides, combining dense high-rise urban streetscapes with white-gray metal facades,
      exposed pipes, glass platforms, and vertical orange engineering signs. Elevated cyan rails connect the buildings.
      Yellow industrial robot arms operate inside warm-lit workshops, small white service robots move along terraces,
      and hovering disc-shaped carriers transport luminous translucent cubes. Green rooftop planters soften the
      architecture. Natural sunlight creates realistic metal and glass reflections.
    establishing_camera: The camera slowly glides forward, keeping the central tower centered as the city operates
      in an orderly rhythm.
    camera_policy: Use establishing_camera only for district establishing views; preserve shot-specific camera directions.
    interior_policy: Use only visible materials and lighting for interior-only shots; use the district paragraph
      in street-visible shots.
