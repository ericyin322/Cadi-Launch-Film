project:
  title: Cadi Launch Film
  aspect_ratio: '16:9'
  label_style: paired
  section_style: detailed
  visual_style: 'Photorealistic live-action cinema footage shot on a digital cinema camera with prime lenses: natural skin texture with visible pores, real fabric weave, physically accurate reflections, shallow depth of field and subtle film grain.'
  japanese_room:
    file: assets/environments/日式.jpg
    reference_mode: image
    applies_to: [SEG-08]

assets:
  heroine:
    priority: 10
    file: assets/characters/heroine-photo-reference-v01.png
    role: identity
    binding: Her face, hair, and clothing follow
    canonical: the female protagonist, a 20-something East Asian female mechanical R&D engineer. She has long, straight, center-parted black hair and wears a tailored taupe-gray blazer, an ivory crew-neck top, and loose light-colored trousers. She is professional, composed, and places a high value on immaculate grooming.
    retention: 'fully preserved: her facial features, long straight center-parted black hair, tailored taupe-gray blazer, ivory crew-neck top, loose light-colored trousers, body proportions, professional composure, and immaculate grooming must remain consistent. She is a real person with real skin, real fabric and real lighting inside the scene described by the timeline.'
  cadi:
    priority: 20
    summon_tokens: [cadi, mascot, plasma, flame head, robot, chest core]
    file: assets/characters/cadi_red.png
    role: identity
    binding: Its design, proportions, and colors follow
    canonical: Cadi, a small flying robot mascot. Its head is composed of actively burning, ethereal red plasma fire with orange-gold inner tongues and a warm white luminous center that continuously flickers, dances, and undulates with rising wisps and subtle luminous embers (an energetic plasma flame, completely non-solid, with zero gelatinous or jelly-like surface tension). Within the dynamic flame sit two oversized oval warm-white eyes with dark red rims and a tiny mouth, atop a dark charcoal-gray segmented robot body with red joint accents and a glowing circular warm-white chest core with a gold-orange rim. Its height is approximately half of the female protagonist's upper body.
    retention: 'fully preserved: its actively burning red plasma fire head with orange-gold inner tongues and a warm white luminous center, continuous flickering combustion, soft rising flame tongues, subtle luminous embers, wind-drag during movement, upward licking and dissipation while hovering, oversized oval warm-white eyes with dark red rims, tiny mouth, dark charcoal-gray segmented robot body with red joint accents, body proportions, and glowing circular warm-white chest core with a gold-orange rim must remain consistent. It is lit by the same real lighting as the scene described by the timeline.'
    extra_negatives: [rubbery, gelatinous, solid jelly texture, solid glass surface]
  layout_ref:
    priority: 30
    file: assets/placement/placement_2D.png
    role: exact_final_layout
    binding: Its exact component identities, proportions, spacing, positions, silhouettes, color grouping, and rectangular plane orientation follow
    canonical: the completed holographic placement layout. Its exact component identities, proportions, spacing, positions, silhouettes, color grouping, and rectangular plane orientation follow
    retention: Preserve the exact component identities, proportions, spacing, positions, silhouettes, color grouping and rectangular orientation; render them as a stable volumetric holographic placement under the scene lighting.
  japanese_room:
    priority: 40
    file: assets/environments/日式.jpg
    role: environment_reference
    binding: Its architecture, materials, lighting, lattice, luminous geometry and rear bonsai follow
    canonical: the minimalist Japanese-inspired technology room
    retention: Preserve the symmetrical white room, textured surfaces, dark reflective floor, cyan and warm-white perimeter light lines, left wooden lattice panel, rear alcove, low wooden plinth and centered sculpted bonsai.

